name: "Contrast gate"
description: "Fail the build when a declared colour cannot be read on any surface the file declares."
author: "F-Keys"

branding:
  icon: "alert-triangle"
  color: "purple"

inputs:
  path:
    description: "Directory to check."
    required: false
    default: "."
  config:
    description: "JSON file of recorded exceptions."
    required: false
    default: ""
  require-pairs:
    description: "Fail if no colour pair was found at all, rather than passing vacuously"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install legible
      shell: bash
      run: pip install --quiet legible

    - name: Contrast gate
      shell: bash
      run: |
        ARGS="${{ inputs.path }}"
        if [ -n "${{ inputs.config }}" ]; then
          ARGS="$ARGS --config ${{ inputs.config }}"
        fi
        if [ "${{ inputs.require-pairs }}" = "true" ]; then
          ARGS="$ARGS --require-pairs"
        fi
        contrast-gate $ARGS

    - name: What it found
      if: failure()
      shell: bash
      run: contrast-gate "${{ inputs.path }}" --list || true
