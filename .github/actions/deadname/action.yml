name: "Deadname gate"
description: "Fail the build when a retired name reaches anything a human reads."
author: "F-Keys"

branding:
  icon: "alert-triangle"
  color: "purple"

inputs:
  path:
    description: "Directory to check."
    required: false
    default: "."
  config:
    description: "JSON file of recorded exceptions."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install gatekit
      shell: bash
      run: pip install --quiet gatekit

    - name: Deadname gate
      shell: bash
      run: |
        ARGS="${{ inputs.path }}"
        if [ -n "${{ inputs.config }}" ]; then
          ARGS="$ARGS --config ${{ inputs.config }}"
        fi
        deadname-gate $ARGS

    - name: What it found
      if: failure()
      shell: bash
      run: deadname-gate "${{ inputs.path }}" --list || true
