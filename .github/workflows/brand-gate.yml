name: gates

# Zengine was dissolved 2026-07-15. This fails the build if the retired
# name reappears in anything a human reads. Machine identifiers (the
# zengineco GitHub org, live *.github.io URLs, published artifact names)
# are allowed by explicit exception inside the script.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  brand-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for retired brand names in human-visible text
        run: python tools/brand-gate.py

      - name: Show what is allowed by exception
        if: failure()
        run: python tools/brand-gate.py --list-allowed

      # This repository does not credit a model for the work. The rule was
      # stated, recorded, and then broken fifteen times in one sitting,
      # because the trailer is a harness default that has to be actively
      # suppressed on every commit. A rule that depends on remembering is
      # not a rule, so it is checked here instead.
      - name: No AI attribution in commit messages
        run: |
          git fetch --no-tags --depth=50 origin main || true
          python tools/brand-gate.py --commits "HEAD~30..HEAD" ||           python tools/brand-gate.py --commits "HEAD"


  # Key-J shipped three defects that existed only because app.html and
  # desktop/src/index.html were maintained as two copies. index.html is a
  # generated file now, and this fails if someone edits it directly or
  # forgets to regenerate it.
  renderer-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Key-J renderer matches app.html
        working-directory: keyj/desktop
        run: node sync-renderer.js --check

  # A 13px floor, because six point type is not a style choice and the
  # person who has to read it has reported it more than once. The tool
  # existed and caught every violation the first time it was pointed at a
  # folder; what was missing was anything that pointed it there. A gate
  # nobody pulls is not a gate.
  type-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nothing renders below the floor
        run: python tools/typefloor.py
      # And nothing renders in a colour that cannot be read on any
      # surface the file declares. Dark grey on navy measured 2.64:1
      # where body text needs 4.5, and was reported by a reader
      # rather than caught by anything.
      - name: Nothing renders unreadable
        run: python tools/contrast.py
      - name: What is unreadable, and against what
        if: failure()
        run: python tools/contrast.py --list
      - name: What is below it, and why
        if: failure()
        run: python tools/typefloor.py --list

      # These three gates are published as `gatekit`, and tools/ is a shim
      # over the same code so CI runs what ships. Every one of them once
      # reported OK on a directory it had never opened; the fixtures below
      # are known-bad and a gate that misses them fails here.
      - name: The gates find what they exist to find
        run: python gatekit/tests/test_gates.py


  # The README standard is a tool, so it is checked rather than trusted:
  # the glyphs against the published gonzalgo banner, and every product
  # name rendering in the same box.
  readme-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Banner font and width
        run: python tools/readme.py --verify

  # The Privacy page says there is no advertising, no analytics and no
  # cookie on f-keys.com. An ad tag pasted into one hand-maintained page
  # turns that into a lie nobody notices, so it is asserted against the
  # files that are served rather than promised. The same job covers the
  # homepage heading, the share image, the structured data and the
  # recovery links on the 404.
  site-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the status-page parity step below runs the browser renderer under
      # node, so this job needs both runtimes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The claims this site makes about itself
        run: python tools/test_site.py

      # buildmd reads the built HTML, so a page whose markdown was not
      # regenerated is a page where the two disagree about what it says.
      - name: Markdown variants match the pages
        run: python tools/buildmd.py --check

      # openapi.json is generated from the files it documents. A stale one
      # describes a dataset that has moved or gone, which an agent cannot
      # detect until it fetches the path and gets nothing.
      - name: The specification matches the data
        run: python tools/buildapi.py --check

      # The Contact page publishes hello@f-keys.com. That only works while
      # the domain accepts mail, and a contact address that bounces fails
      # silently - nobody tells you the email they sent went nowhere.
      - name: The contact domain still accepts mail
        run: |
          dig +short MX f-keys.com | grep -q . \
            || { echo "f-keys.com has no MX record; hello@f-keys.com bounces"; exit 1; }
          dig +short MX f-keys.com

      # A font request reports the reader's IP to a third party before any
      # of the page's own content renders. Sixty-one pages did it. This
      # fails if one starts again, and if the desktop app's mirrored copy
      # goes missing, which would break its typography silently.
      - name: No page reaches Google for a typeface
        run: python tools/fonts.py --verify

      # The status page is rendered twice - into the HTML here, and in
      # the browser by status/status.js when it re-reads latest.json.
      # Drift between them would only show to a reader with JavaScript
      # on, comparing against a page they cannot see.
      - name: The server and the browser render the same status page
        run: python tools/test_statuspage.py

      # A mark dropped in without its derivatives rebuilt means the
      # product page and the share card disagree with the source file.
      - name: Product marks match their sources
        run: python tools/productart.py --verify

      - name: Share card and favicons
        run: |
          pip install --quiet pillow
          python tools/ogimage.py --verify

  # GitHub Pages cannot negotiate on Accept, so a Worker does it. The two
  # ways it can go wrong are both silent: reading `text/markdown;q=0` as a
  # request hands every browser a text file, and a wrong path mapping
  # hands an agent the wrong page with no way to tell.
  markdown-negotiation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Accept negotiation, against a fake origin
        working-directory: worker
        run: node test_worker.mjs

  # keyj-cli and keyj/app.html are two implementations of the same
  # conversions. Key-J has already shipped three defects that existed only
  # because two copies of one thing drifted, so this diffs them: the real
  # functions are lifted out of app.html, run under node, and compared.
  keyj-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python and JavaScript agree
        working-directory: keyj-cli
        run: python tests/test_parity.py

      # `keyj play` installs a system-wide keyboard listener, and four places
      # claim it never learns which key you pressed. This asserts that as a
      # property rather than repeating it as a promise: the function a key
      # press calls takes no key, so the process cannot retain one.
      - name: The live player, and the claim it makes
        working-directory: keyj-cli
        run: python tests/test_play.py
