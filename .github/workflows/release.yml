name: release

# Turns a git tag into things people can actually install.
#
# Tag format:  <product>-v<version>     e.g.  keyj-v1.1.0, moonbeam-v1.0.0
#
#   keyj      -> Electron installers, built per platform, attached to a Release
#   moonbeam  -> Python wheel + sdist, published to PyPI and attached too
#   plumhud   -> the same
#   gatekit   -> legible on PyPI (typefloor, contrast-gate,
#                deadname-gate). The directory is gatekit/; the
#                distribution is legible, because gatekit was
#                already taken on PyPI by an unrelated project.
#
# Adding a product means adding a job condition, not another workflow.

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to build'
        type: choice
        options: [keyj, moonbeam, plumhud, gatekit]
        default: keyj
      version:
        description: 'Version, without the v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  identify:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.parse.outputs.product }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PRODUCT="${{ inputs.product }}"; VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            PRODUCT="${REF%%-v*}"; VERSION="${REF##*-v}"
          fi
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${PRODUCT}-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building $PRODUCT $VERSION"

  # ── Electron products ───────────────────────────────────────
  desktop:
    needs: identify
    if: needs.identify.outputs.product == 'keyj'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refuse to ship a version the package does not claim
        shell: bash
        working-directory: keyj/desktop
        run: |
          # The Python branch has had this check since day one. The desktop
          # branch did not, so tagging v1.4.0 while package.json still said
          # 1.3.0 would have produced installers named 1.3.0 under a 1.4.0
          # release - the wrong version under the right name.
          DECLARED=$(node -p "require('./package.json').version")
          TAGGED="${{ needs.identify.outputs.version }}"
          echo "package.json: $DECLARED   tag: $TAGGED"
          if [ "$DECLARED" != "$TAGGED" ]; then
            echo "::error::package.json says $DECLARED but the tag says $TAGGED."
            exit 1
          fi

      - name: Refuse to build a stale renderer
        shell: bash
        working-directory: keyj/desktop
        run: node sync-renderer.js --check

      - name: Build Key-J
        shell: bash
        working-directory: keyj/desktop
        run: |
          npm install --no-audit --no-fund
          # uiohook-napi is native, so each platform builds on its own runner.
          if [ "${{ matrix.label }}" = "windows" ]; then
            npx electron-builder --win --x64 --publish never
          else
            npx electron-builder --linux --x64 --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: |
            keyj/desktop/dist/*.exe
            keyj/desktop/dist/*.AppImage
          if-no-files-found: warn

  # ── Python products ─────────────────────────────────────────
  python-package:
    needs: identify
    if: needs.identify.outputs.product == 'moonbeam' || needs.identify.outputs.product == 'plumhud' || needs.identify.outputs.product == 'keyj-cli' || needs.identify.outputs.product == 'gatekit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse to ship a version the package does not claim
        working-directory: ${{ needs.identify.outputs.product }}
        run: |
          # Tagging v1.0.1 while pyproject still says 1.0.0 would publish the
          # wrong version under the right name, and PyPI is append-only.
          DECLARED=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          TAGGED="${{ needs.identify.outputs.version }}"
          echo "pyproject: $DECLARED   tag: $TAGGED"
          if [ "$DECLARED" != "$TAGGED" ]; then
            echo "::error::pyproject.toml says $DECLARED but the tag says $TAGGED."
            exit 1
          fi

      - name: Build the wheel and sdist
        working-directory: ${{ needs.identify.outputs.product }}
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Install the built wheel and run the command
        working-directory: ${{ needs.identify.outputs.product }}
        run: |
          # Proving the artifact works beats proving the source works.
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          # The script name is read from the package rather than assumed to
          # equal the directory: keyj-cli installs a command called `keyj`,
          # and reading it checks what the wheel declares instead of what
          # this workflow expects it to.
          SCRIPT=$(python -c "import re,io;b=io.open('pyproject.toml',encoding='utf-8').read().split('[project.scripts]',1)[1];print(re.search(r'^[ \\t]*([A-Za-z0-9_.-]+)[ \\t]*=',b,re.M).group(1))")
          echo "console script: $SCRIPT"
          "/tmp/verify/bin/$SCRIPT" --help > /dev/null
          echo "console script runs from the built wheel"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        working-directory: ${{ needs.identify.outputs.product }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_TOKEN not set - skipping the upload."
            echo "The GitHub release below still gets the files."
            exit 0
          fi
          python -m twine upload --non-interactive --skip-existing dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: ${{ needs.identify.outputs.product }}/dist/*
          if-no-files-found: warn

  # ── One release, whatever was produced ──────────────────────
  publish:
    needs: [identify, desktop, python-package]
    if: always() && needs.identify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/

      - name: Refuse a release that is missing a platform
        env:
          PRODUCT: ${{ needs.identify.outputs.product }}
        run: |
          # A matrix leg failing used to produce a published release holding
          # one of the two installers, which reads as a complete release to
          # anyone downloading it. Half a release is worse than none.
          if [ "$PRODUCT" = "keyj" ]; then
            MISSING=""
            ls release/*.exe      >/dev/null 2>&1 || MISSING="$MISSING Windows(.exe)"
            ls release/*.AppImage >/dev/null 2>&1 || MISSING="$MISSING Linux(.AppImage)"
            if [ -n "$MISSING" ]; then
              echo "::error::Key-J release is missing:$MISSING - refusing to publish."
              exit 1
            fi
            echo "  both installers present"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identify.outputs.tag }}
          VERSION: ${{ needs.identify.outputs.version }}
          PRODUCT: ${{ needs.identify.outputs.product }}
        run: |
          if [ -z "$(ls -A release/ 2>/dev/null)" ]; then
            echo "No artifacts were produced - refusing to publish an empty release."
            exit 1
          fi
          # Notes are written a line at a time. Multi-line strings inside a
          # YAML block scalar must stay indented, and anything that dedents
          # silently produces an invalid workflow.
          NOTES_FILE=notes.md
          case "$PRODUCT" in
            plumhud)
              TITLE="PlumHUD $VERSION"
              {
                echo "Miner fleet monitor - overlay HUD, alerts and history."
                echo
                echo '```'
                echo "pip install plumhud"
                echo "plumhud"
                echo '```'
                echo
                echo "v4 stops inventing missing readings, and stops writing"
                echo "your config to whatever folder you launched from."
              } > "$NOTES_FILE"
              ;;
            keyj-cli)
              TITLE="keyj $VERSION"
              {
                echo "Key-J on the command line. Tablature in, notes out, and"
                echo "any keystroke plays the next one."
                echo
                echo '```'
                echo "pip install keyj"
                echo "keyj tab solo.txt -o song.txt"
                echo "keyj render song.txt out.wav --bpm 140"
                echo '```'
                echo
                echo "tab, render and show are standard library only and never"
                echo "touch your keyboard. The live player is opt-in:"
                echo "pip install 'keyj[play]' - and it never reads WHICH key"
                echo "you pressed, only that one was."
                echo
                echo "Manual: https://f-keys.com/keyj/manual/"
              } > "$NOTES_FILE"
              ;;
            moonbeam)
              TITLE="Moonbeam $VERSION"
              {
                echo "Find the NerdMiners on your network and read their vitals."
                echo
                echo '```'
                echo "pip install moonbeam-miner"
                echo "moonbeam"
                echo '```'
                echo
                echo "No dependencies. A dash means the miner did not report"
                echo "that field - never a stand-in number."
              } > "$NOTES_FILE"
              ;;
            *)
              TITLE="Key-J $VERSION"
              {
                echo "Key-J turns your keyboard into an instrument."
                echo
                echo "**Windows** - download the .exe and run it."
                echo "**Linux** - download the .AppImage, chmod +x, run it."
                echo
                echo "Browser version: https://f-keys.com/keyj/"
              } > "$NOTES_FILE"
              ;;
          esac
          gh release create "$TAG" release/* --title "$TITLE"             --notes-file "$NOTES_FILE" --repo "$GITHUB_REPOSITORY"             || gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
