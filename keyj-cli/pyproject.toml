[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyj"
version = "0.1.2"
description = "Turn guitar tablature into notes, render it, and play it back with any keystroke."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vincent Gonzalez" }]
keywords = ["music", "tablature", "guitar", "midi", "wav", "keyboard", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
# tab, render and show are standard library only. The live player is the
# only part that needs anything, and it is opt-in for that reason.
dependencies = []

[project.optional-dependencies]
play = ["pynput>=1.7", "sounddevice>=0.4"]

[project.urls]
Homepage = "https://f-keys.com/keyj/"
Manual = "https://f-keys.com/keyj/manual/"
Source = "https://github.com/vince-gonzalez/f-keys/tree/main/keyj-cli"

[project.scripts]
keyj = "keyj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
