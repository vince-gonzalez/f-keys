[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonbeam-miner"
version = "1.0.2"
description = "Find the NerdMiners on your network and read their vitals, from the terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vincent Gonzalez" }]
keywords = ["bitcoin", "nerdminer", "bitaxe", "esp32", "mining", "axeos", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://f-keys.com/moonbeam/"
Source = "https://github.com/vince-gonzalez/f-keys/tree/main/moonbeam"

[project.scripts]
moonbeam = "moonbeam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
