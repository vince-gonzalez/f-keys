# ============================================================
# relay - webhook receiver, verification and attempt log
# F-Keys | www.f-keys.com
# ------------------------------------------------------------
# Step 1 of the relay: receive, verify at the door, record.
# Queue retries, KV dedupe, the per-destination Durable Object
# and the R2 archive are steps 2 to 5 and are not bound yet.
# A binding that exists before the code that uses it is a thing
# that silently does nothing.
#
# Create:  npx wrangler d1 create f-keys-relay
# Apply:   npx wrangler d1 execute f-keys-relay --remote --file schema.sql
# Secret:  npx wrangler secret put RELAY_SECRET_DEMO
# Deploy:  npx wrangler deploy
# ============================================================

name = "f-keys-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No custom domain yet, on purpose. A rejected request still costs a
# D1 write until the rate-limiting Durable Object lands in step 4, so
# the address is not advertised until it can defend itself.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "f-keys-relay"
database_id = "3bce2c78-c6c3-4a3f-b373-31c78d138f77"

# Dedupe. KV is the fast path and migration 0002's unique index is the
# guarantee; KV alone cannot be, because it is eventually consistent and
# a retry storm is exactly the case that beats it.
[[kv_namespaces]]
binding = "SEEN"
id = "85618647398f4686984289868e6022b1"

# The delivery queue. Producer and consumer are the same Worker: one
# deploy, one place where the signing scheme lives, and no second service
# to keep in step with this one.
[[queues.producers]]
binding = "DELIVERIES"
queue = "relay-deliveries"

[[queues.consumers]]
queue = "relay-deliveries"
max_batch_size = 10
max_batch_timeout = 5
# Our own cap lives in endpoints.max_attempts and is per endpoint. This
# is the backstop underneath it, high enough not to pre-empt it.
max_retries = 20

# One limiter per endpoint slug. A Durable Object is the only thing here
# that can hold a counter several requests agree on; KV would let a flood
# read the same stale balance a hundred times at once, which is exactly
# the case the limiter exists for.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "EndpointLimiter"

[[migrations]]
tag = "v1-limiter"
new_sqlite_classes = ["EndpointLimiter"]

[observability]
enabled = true
