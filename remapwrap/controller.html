<!DOCTYPE html>
<html lang="en">
<head>
<!--
// ============================================================
// WORKFLOW STACK
// File:        controller.html
// Product:     RemapWrap  (F-Keys Creative LLC)
// Author:      Vincent Gonzalez | (c) 2026 F-Keys Creative LLC | www.f-keys.com
// Version:     v0.1.0
// Description: RemapWrap controller — touch-optimized keypad
//              served to phone browser via remapwrap-server.js.
//              Sends keypress events to PC via WebSocket.
// Boot Order:
//   1. DOM ready → initController()
//   2. SERVER_IP injected by server at serve time
//   3. connectWebSocket() → register as 'controller'
//   4. Await layout from dashboard (or use defaults)
//   5. renderKeys() → draw button grid
//   6. Touch events → sendKeypress()
// External Deps:
//   - Google Fonts (Bebas Neue)
//   - WebSocket: ws://[server-ip]:7332
// Layout Target: 360–430px mobile portrait
// Browser Target: Chrome/Safari mobile (latest)
// ============================================================

// ASSET MANIFEST
// Google Fonts: Bebas Neue
// WebSocket: ws://[SERVER_IP]:[WS_PORT]
// ============================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RemapWrap - Controller</title>
<style>
  :root {
    /* ── ca. 2001, and legible on purpose ────────────────────────
       Chrome, bevels and a title bar, because that era got one
       thing right that flat design gave away: a raised edge and a
       sunken edge tell you what is pressable before you touch it.

       Every ink here is black or white against the surface it sits
       on. The old palette put #4a6070 on #131b24, which measures
       2.64:1 - under the 4.5 a body of text needs and the reason
       none of this could be read. tools/contrast.py fails the build
       on it now. */
    --bg:         #5a7a99;   /* the desktop behind the app        */
    --bg2:        #d4d0c8;   /* chrome: the classic button face   */
    --bg3:        #0a0a0a;   /* the readout, black like an LCD    */
    --panel:      #d4d0c8;
    --field:      #ffffff;   /* sunken input, black text          */

    --border:       #808080; /* mid bevel                         */
    --border-light: #ffffff; /* raised edge                       */
    --border-dark:  #404040; /* sunken edge                       */

    --text:        #000000;  /* 15.9:1 on chrome                  */
    --text-dim:    #2b2b2b;  /* 11.6:1 on chrome, still black ink */
    --text-bright: #000000;
    --text-invert: #ffffff;  /* on the title bar and the readout  */

    --title-a:    #0a246a;   /* title bar gradient, left          */
    --title-b:    #4b81c4;   /* title bar gradient, right         */
    --accent:     #0a246a;   /* selection, focus                  */
    --accent2:    #0d6b0d;   /* go / connected                    */
    --accent3:    #a80000;   /* stop / danger                     */
    --lcd:        #35ff5d;   /* on --bg3 only                     */

    --font-display: Tahoma, 'MS Sans Serif', Geneva, sans-serif;
    --font-mono:    'Lucida Console', 'Courier New', monospace;
    --font:         Tahoma, 'MS Sans Serif', Geneva, sans-serif;
    --glow:       none;
    --glow2:      none;
    --radius:     0px;
  }

  /* ── the chrome kit ──────────────────────────────────────────
     Three borders and no shadows. A raised control has a white top
     and left and a dark bottom and right; a sunken one has them the
     other way round. That is the whole trick and it is why a 2001
     dialog is readable at a glance. */

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 6px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── Header bar ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 16px 10px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: var(--glow);
  }
  .conn-badge {
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 1.5px;
    padding: 3px 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    transition: all 0.3s;
  }
  .conn-badge.on  { border-color: var(--accent);  color: var(--accent);  box-shadow: var(--glow); }
  .conn-badge.err { border-color: var(--accent3); color: var(--accent3); }

  /* ── Key grid wrapper ── */
  .grid-wrap {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    padding: 12px;
    overflow: hidden;
  }

  .key-grid {
    display: grid;
    gap: 8px;
    width: 100%;
    grid-template-columns: repeat(var(--cols, 4), 1fr);
    grid-template-rows: repeat(var(--rows, 3), 1fr);
  }

  /* ── Key button ── */
  .key-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: border-color 0.1s, background 0.1s, transform 0.08s;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .key-btn::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(circle at 50% 50%, rgba(102,221,3,0.18), transparent 70%);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .key-btn.pressed {
    border-color: var(--accent);
    transform: scale(0.93);
    box-shadow: var(--glow);
  }
  .key-btn.pressed::after { opacity: 1; }

  /* ── the control types ────────────────────────────────────────
     Everything here is sized for a thumb on glass, at arm's length,
     often in a dark room. Nothing below 13px. */

  /* A toggle shows its state without being touched. */
  .lamp {
    position: absolute; top: 9px; right: 9px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-dim); opacity: .35; transition: none;
  }
  .key-btn.on .lamp { background: var(--accent); opacity: 1;
                      box-shadow: 0 0 9px var(--accent); }
  .key-btn.on { border-color: var(--accent); }

  /* A pad reads as something you strike, not something you click. */
  .key-btn.type-pad { border-radius: 12px; border-width: 2px; }
  .key-btn.type-pad.pressed { transform: scale(.94); }

  /* Dials and sliders carry a face and a reading. */
  .value-ctl { touch-action: none; user-select: none; -webkit-user-select: none; }
  .value-ctl.active { border-color: var(--accent); }

  .dial-face {
    position: relative; width: 62px; height: 62px; margin: 0 auto 6px;
    border-radius: 50%; background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.10);
    display: flex; align-items: center; justify-content: center;
  }
  .dial-arc {
    position: absolute; inset: -2px; border-radius: 50%;
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%);
    mask: radial-gradient(circle, transparent 60%, #000 62%);
  }
  .dial-pointer {
    position: absolute; inset: 0; border-radius: 50%;
  }
  .dial-pointer::after {
    content: ''; position: absolute; left: 50%; top: 6px;
    width: 3px; height: 15px; margin-left: -1.5px; border-radius: 2px;
    background: var(--text-bright);
  }

  .slider-face {
    position: relative; width: 42px; height: 62px; margin: 0 auto 6px;
    border-radius: 8px; background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.10); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .slider-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--accent); opacity: .55;
  }
  .value-read {
    /* The reading sits in a dark well, not on the key face, so it takes
       white rather than inheriting the ink the key chose for its label. */
    position: relative; font-family: var(--font-mono);
    font-size: 17px; font-weight: 700; color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }

  .key-label {
    font-size: clamp(13px, 3.5vw, 20px);
    letter-spacing: 1px;
    line-height: 1;
    text-align: center;
    padding: 0 4px;
    color: inherit;   /* the key computes its own ink; see inkFor */
  }
  [data-type=slider] .key-label { writing-mode: vertical-rl; }
  .key-sub {
    color: inherit;   /* the key decides the ink; see inkFor */
    opacity: .75;
    font-family: 'Courier New', monospace;
    font-size: clamp(13px, 2vw, 15px);
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* ── Footer ── */
  .footer {
    padding: 8px 16px calc(8px + var(--safe-bot));
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .footer-brand {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .ping-disp {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* ── App wrapper ── */
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

/* ── Pairing gate ──────────────────────────────────────────────
   Nothing here goes below 15px. This is the first screen anyone
   sees and it is read across a room. */
#pinScreen {
  display: none;
  position: fixed; inset: 0; z-index: 9000;
  background: var(--bg);
  align-items: center; justify-content: center;
  padding: 24px;
}
.pin-box {
  width: 100%; max-width: 380px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-top-color: var(--border-light);
  border-left-color: var(--border-light);
  border-right-color: var(--border-dark);
  border-bottom-color: var(--border-dark);
  padding: 22px 20px 20px;
}
.pin-title {
  font-family: var(--font-display), var(--font);
  font-size: 20px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-bright);
  margin-bottom: 10px;
}
.pin-note { font-size: 15px; line-height: 1.45; color: var(--text); margin-bottom: 18px; }
.pin-input {
  display: block; width: 100%; box-sizing: border-box;
  font-family: var(--font-mono), monospace;
  font-size: 34px; letter-spacing: 10px; text-align: center;
  padding: 14px 10px;
  color: var(--text-bright);
  background: var(--field);
  border: 2px inset var(--border);
  margin-bottom: 16px;
}
.pin-input::placeholder { color: var(--text); opacity: .45; letter-spacing: 10px; }
.pin-go {
  display: block; width: 100%;
  font-family: var(--font-display), var(--font);
  font-size: 18px; font-weight: 700; letter-spacing: 1px;
  padding: 14px;
  color: var(--text-bright);
  background: var(--bg2);
  border: 2px outset var(--border);
  cursor: pointer;
}
.pin-go:active { border-style: inset; }
.pin-hint { font-size: 13px; line-height: 1.4; color: var(--text); margin-top: 14px; }

/* A press has to be visible, not only felt: iOS has no vibrate API, so
   the ring is the only confirmation an iPhone user ever gets. */
.key-btn.confirmed {
  animation: rw-confirm 320ms ease-out;
}
@keyframes rw-confirm {
  0%   { box-shadow: 0 0 0 0 var(--accent); }
  100% { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
}
/* A command the PC does not run yet must not look the same as one it does. */
.key-btn.unwired {
  animation: rw-unwired 900ms ease-out;
}
@keyframes rw-unwired {
  0%, 100% { outline: 0 solid transparent; }
  20%, 60% { outline: 3px solid var(--accent3); outline-offset: -3px; }
}
/* Nothing moves for somebody who asked the system not to move things. */
@media (prefers-reduced-motion: reduce) {
  .key-btn.confirmed, .key-btn.unwired { animation: none; }
  .key-btn.confirmed { box-shadow: 0 0 0 3px var(--accent); }
  .key-btn.unwired { outline: 3px solid var(--accent3); outline-offset: -3px; }
}

/* A volume change made on the keyboard used to make the dial on the phone
   jump between two positions with nothing in between, which reads as a
   glitch rather than as a reading. It travels now - but only when the PC
   is moving it. Under a thumb there must be no lag at all, so the drag
   turns the transition off for as long as it lasts. */
.dial-arc, .dial-pointer, .slider-fill {
  transition: transform 180ms ease-out, background 180ms ease-out,
              height 180ms ease-out;
}
.value-ctl[data-holding="1"] .dial-arc,
.value-ctl[data-holding="1"] .dial-pointer,
.value-ctl[data-holding="1"] .slider-fill {
  transition: none;
}
@media (prefers-reduced-motion: reduce) {
  .dial-arc, .dial-pointer, .slider-fill { transition: none; }
}

/* ── Pages ─────────────────────────────────────────────────────
   Tabs are 44px tall because that is the smallest target a thumb
   hits reliably, and this is the control somebody uses while doing
   something else with their other hand. */
.page-strip {
  display: flex;
  gap: 6px;
  padding: 8px 10px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page-strip::-webkit-scrollbar { display: none; }
.page-tab {
  flex: 0 0 auto;
  min-height: 44px;
  min-width: 56px;
  padding: 10px 16px;
  font-family: var(--font-display), var(--font);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text);
  background: var(--panel);
  border: 2px outset var(--border);
  cursor: pointer;
}
.page-tab[aria-selected="true"] {
  color: var(--text-bright);
  background: var(--bg2);
  border-style: inset;
}
.page-tab:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ── Scanning and settings ─────────────────────────────────────
   The highlight has to be unmistakable from across a room and must
   not rely on colour alone, because the person using scanning may
   also have low vision. Outline plus a lift, not a tint. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.key-btn.scanning {
  outline: 6px solid var(--accent);
  outline-offset: -3px;
  z-index: 5;
  box-shadow: 0 0 0 3px #000, 0 0 22px var(--accent);
}
.settings-btn {
  position: fixed; right: 10px; bottom: 10px; z-index: 900;
  width: 52px; height: 52px;          /* comfortably over the 44px floor */
  font-size: 24px; line-height: 1;
  color: var(--text-bright);
  background: var(--panel);
  border: 2px outset var(--border);
  cursor: pointer;
}
.sheet {
  position: fixed; inset: 0; z-index: 950;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet[hidden] { display: none; }
.sheet-inner {
  width: 100%; max-width: 520px;
  max-height: 88vh; overflow-y: auto;
  background: var(--panel);
  border: 2px solid var(--border);
  border-top-color: var(--border-light);
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheet-title {
  font-family: var(--font-display), var(--font);
  font-size: 20px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-bright); margin-bottom: 18px;
}
.sheet-field { margin-bottom: 20px; }
.sheet-label {
  display: block; font-size: 14px; letter-spacing: 1px;
  color: var(--text); margin-bottom: 8px;
}
.sheet-input {
  display: block; width: 100%; box-sizing: border-box;
  min-height: 48px; font-size: 16px;
  color: var(--text-bright); background: var(--field);
  border: 2px inset var(--border);
  padding: 10px;
}
input[type=range].sheet-input { padding: 0; }
.sheet-note { font-size: 14px; line-height: 1.45; color: var(--text); margin-top: 6px; }
.sheet-done {
  display: block; width: 100%; min-height: 52px;
  font-family: var(--font-display), var(--font);
  font-size: 18px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-bright); background: var(--bg2);
  border: 2px outset var(--border); cursor: pointer;
}

/* ── Compose, timers and the two faces of a key ────────────────── */
.compose-area { min-height: 120px; resize: vertical; line-height: 1.4; }
.sheet-done.compose-alt { margin-top: 10px; background: var(--panel); }
.key-btn .timer-face {
  font-family: var(--font-mono), monospace;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.1;
}
/* A finished countdown must be obvious without relying on colour, since
   the person it is telling may not be looking straight at it. */
.key-btn.timer-done { animation: rw-done 1s ease-in-out infinite; }
@keyframes rw-done {
  0%, 100% { outline: 4px solid transparent; outline-offset: -4px; }
  50%      { outline: 4px solid var(--accent); outline-offset: -4px; }
}
.key-btn.timer-running .timer-face { color: var(--lcd); }
@media (prefers-reduced-motion: reduce) {
  .key-btn.timer-done { animation: none; outline: 4px solid var(--accent);
                        outline-offset: -4px; }
}
</style>

<link href="/assets/fonts.css" rel="stylesheet">

<body>

<!-- ── Pairing gate ────────────────────────────────────────────────
     Shown only when this phone has no secret the PC accepts. The
     digits are large because they are read off one screen and typed
     on another, often at arm's length.                            -->
<div id="pinScreen">
  <div class="pin-box">
    <div class="pin-title">PAIR THIS PHONE</div>
    <div class="pin-note" id="pinNote">Enter the six digits shown on your PC.</div>
    <input id="pinInput" class="pin-input" type="text" inputmode="numeric"
           autocomplete="one-time-code" maxlength="6" placeholder="000000"
           aria-label="Six digit pairing code">
    <button id="pinGo" class="pin-go" type="button">CONNECT</button>
    <div class="pin-hint">Scanning the QR code on the PC skips this step.</div>
  </div>
</div>

<div class="app">

  <div class="header">
    <div class="logo">RemapWrap</div>
    <div class="conn-badge" id="conn-badge">CONNECTING…</div>
  </div>

  <!-- Pages. Hidden entirely when a profile has one, because a strip of
       one tab is furniture rather than navigation. -->
  <nav class="page-strip" id="page-strip" role="tablist"
       aria-label="Pages in this profile" hidden></nav>

  <!-- Announced to a screen reader as the highlight moves. Visually
       hidden, because the highlight itself is the visual version. -->
  <div id="scan-say" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Settings live on the phone rather than the PC, because the person
       who needs scanning is the person holding this, and asking them to
       walk to a computer to turn on the thing that lets them use the
       computer is the wrong way round. -->
  <button id="settings-open" class="settings-btn" type="button"
          aria-label="Accessibility settings">&#9881;</button>

  <div id="settings-sheet" class="sheet" role="dialog" aria-modal="true"
       aria-label="Accessibility settings" hidden>
    <div class="sheet-inner">
      <div class="sheet-title">ACCESSIBILITY</div>

      <div class="sheet-field">
        <label class="sheet-label" for="scan-mode">SELECTION</label>
        <select id="scan-mode" class="sheet-input">
          <option value="off">Touch the key I want</option>
          <option value="auto">Scan on its own, I press to choose</option>
          <option value="step">I press to move, hold to choose</option>
        </select>
        <div class="sheet-note" id="scan-mode-note"></div>
      </div>

      <div class="sheet-field" id="scan-pattern-field">
        <label class="sheet-label" for="scan-pattern">HOW IT SWEEPS</label>
        <select id="scan-pattern" class="sheet-input">
          <option value="linear">One key at a time</option>
          <option value="rowcol">A row first, then the keys in it</option>
        </select>
        <div class="sheet-note" id="scan-pattern-note"></div>
      </div>

      <div class="sheet-field" id="scan-rate-field">
        <label class="sheet-label" for="scan-rate">HOW LONG ON EACH KEY</label>
        <input id="scan-rate" class="sheet-input" type="range"
               min="400" max="4000" step="100" value="1200">
        <div class="sheet-note" id="scan-rate-note">1.2 seconds</div>
      </div>

      <div class="sheet-field">
        <label class="sheet-label" for="dwell-ms">HOLD TO CHOOSE</label>
        <input id="dwell-ms" class="sheet-input" type="range"
               min="0" max="2000" step="100" value="600">
        <div class="sheet-note" id="dwell-note">0.6 seconds</div>
      </div>

      <div class="sheet-field">
        <label class="sheet-label" for="repeat-guard">IGNORE A SECOND PRESS WITHIN</label>
        <input id="repeat-guard" class="sheet-input" type="range"
               min="0" max="1500" step="50" value="0">
        <div class="sheet-note" id="repeat-note">off</div>
      </div>

      <button id="settings-close" class="sheet-done" type="button">DONE</button>
    </div>
  </div>

  <!-- Compose. The phone already has the keyboard somebody can use -
       theirs, with their prediction, their dictation, their language -
       and the PC has none of that for them. Typing here and sending it
       is the shortest route between a person and a text box on a
       computer they cannot easily type into. -->
  <div id="compose-sheet" class="sheet" role="dialog" aria-modal="true"
       aria-label="Type something" hidden>
    <div class="sheet-inner">
      <div class="sheet-title" id="compose-title">TYPE SOMETHING</div>
      <textarea id="compose-text" class="sheet-input compose-area"
                rows="4" aria-label="What to send"></textarea>
      <div class="sheet-note" id="compose-note">It goes into whatever is in front on the PC.</div>
      <button id="compose-send" class="sheet-done" type="button">SEND TO THE PC</button>
      <button id="compose-say" class="sheet-done compose-alt" type="button">SAY IT OUT LOUD</button>
      <button id="compose-close" class="sheet-done compose-alt" type="button">CANCEL</button>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="key-grid" id="key-grid"></div>
  </div>

  <div class="footer">
    <div class="footer-brand">(c) 2026 F-Keys Creative LLC</div>
    <div class="ping-disp" id="ping-disp">-- ms</div>
  </div>

</div>

<script>
/* ===== CONFIG BLOCK ===== */
/* __SERVER_IP_INJECT__ */   // Replaced at serve time by remapwrap-server.js
var CFG = {
  WS_PORT:       typeof WS_PORT     !== 'undefined' ? WS_PORT     : 7332,
  SERVER_IP:     typeof SERVER_IP   !== 'undefined' ? SERVER_IP   : window.location.hostname,
  PING_INTERVAL: 5000,
  HAPTIC_MS:     40,
  DEV_MODE:      true,
};
/* ===== END CONFIG BLOCK ===== */

// ── State ──────────────────────────────────────────────────────
var ws          = null;
var pingTimer   = null;
var pingStart   = 0;
var pressTimers = {};   // per-key hold timers (future: long-press)

// Default layout (overwritten by dashboard push)
var layout = {
  cols: 4,
  rows: 3,
  keys: [
    { id: 'k1',  label: 'COPY',      sub: 'ctrl+c',    action: 'ctrl+c'   },
    { id: 'k2',  label: 'PASTE',     sub: 'ctrl+v',    action: 'ctrl+v'   },
    { id: 'k3',  label: 'UNDO',      sub: 'ctrl+z',    action: 'ctrl+z'   },
    { id: 'k4',  label: 'SAVE',      sub: 'ctrl+s',    action: 'ctrl+s'   },
    { id: 'k5',  label: 'MUTE',      sub: 'vol mute',  action: 'mute'     },
    { id: 'k6',  label: 'VOL +',     sub: 'vol up',    action: 'volumeup' },
    { id: 'k7',  label: 'VOL −',     sub: 'vol dn',    action: 'volumedown'},
    { id: 'k8',  label: 'PLAY',      sub: 'media',     action: 'playpause'},
    { id: 'k9',  label: 'FULL SCR',  sub: 'f11',       action: 'f11'      },
    { id: 'k10', label: 'REFRESH',   sub: 'f5',        action: 'f5'       },
    { id: 'k11', label: 'SCREENSHOT',sub: 'win+shift+s',action:'win+shift+s'},
    { id: 'k12', label: 'CLOSE TAB', sub: 'ctrl+w',    action: 'ctrl+w'   },
  ]
};

// ── Init ───────────────────────────────────────────────────────
window.onload = function() {
  renderKeys();
  connectWS();
};

// ── WebSocket ──────────────────────────────────────────────────
// ── Keeping the screen on ────────────────────────────────────────
// A control surface that goes black after thirty seconds is not a control
// surface. The lock is dropped when the page is hidden, which is required
// - the browser revokes it anyway - and is re-taken on return, otherwise
// switching apps once turns the deck off for good.
var wakeLock = null;

function holdScreenAwake() {
  if (!('wakeLock' in navigator)) { return; }      // iOS before 16.4, older Android
  navigator.wakeLock.request('screen').then(function (lock) {
    wakeLock = lock;
    lock.addEventListener('release', function () { wakeLock = null; });
  }).catch(function () { /* refused: battery saver, or not user-activated yet */ });
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !wakeLock) { holdScreenAwake(); }
});

// Some browsers only grant the lock after a gesture, so ask again on the
// first touch as well as at load.
document.addEventListener('DOMContentLoaded', function () {
  loadAccess();
  wireSettings();
  wireCompose();
  holdScreenAwake();
  var once = function () {
    holdScreenAwake();
    document.removeEventListener('touchstart', once);
    document.removeEventListener('click', once);
  };
  document.addEventListener('touchstart', once, { passive: true });
  document.addEventListener('click', once);
});

// ── Pairing ──────────────────────────────────────────────────────
// Three ways a phone gets here, and only the first two are allowed in:
//   scanned the QR   the secret arrives in the URL
//   paired earlier   the secret is in this browser's storage
//   typed the address the server refuses, and the PIN screen opens
var TOKEN_KEY = 'remapwrap.token';
var unpaired = false;

function readToken() {
  var m = /[?&]k=([0-9a-f]{64})/.exec(window.location.search);
  if (m) {
    try { localStorage.setItem(TOKEN_KEY, m[1]); } catch (e) { /* private mode */ }
    // Take the secret out of the address bar so it is not left in history,
    // shoulder-surfed, or handed on when somebody shares the link.
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, '', window.location.pathname);
    }
    return m[1];
  }
  try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
}

var PAIR_TOKEN = readToken();

document.addEventListener('DOMContentLoaded', function () {
  var go = document.getElementById('pinGo');
  var box = document.getElementById('pinInput');
  if (go) { go.addEventListener('click', submitPin); }
  if (box) {
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { submitPin(); }
    });
    // Six digits typed means the person is finished; asking them to reach
    // for a button afterwards is a step for nothing.
    box.addEventListener('input', function () {
      box.value = box.value.replace(/[^0-9]/g, '').slice(0, 6);
      if (box.value.length === 6) { submitPin(); }
    });
  }
});

function showPinScreen(message) {
  stopPing();
  var el = document.getElementById('pinScreen');
  if (!el) { return; }
  el.style.display = 'flex';
  var note = document.getElementById('pinNote');
  if (note) { note.textContent = message || 'Enter the six digits shown on your PC.'; }
  var box = document.getElementById('pinInput');
  if (box) { box.value = ''; box.focus(); }
}

function hidePinScreen() {
  var el = document.getElementById('pinScreen');
  if (el) { el.style.display = 'none'; }
}

function submitPin() {
  var box = document.getElementById('pinInput');
  var note = document.getElementById('pinNote');
  var pin = (box && box.value || '').replace(/[^0-9]/g, '');
  if (pin.length !== 6) {
    if (note) { note.textContent = 'Six digits.'; }
    return;
  }
  if (note) { note.textContent = 'Checking…'; }
  fetch('/pair', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: pin })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.ok && d.token) {
      PAIR_TOKEN = d.token;
      try { localStorage.setItem(TOKEN_KEY, d.token); } catch (e) { /* private mode */ }
      hidePinScreen();
      connectWS();
    } else {
      if (note) { note.textContent = (d && d.error) || 'That PIN is not right.'; }
      if (box) { box.value = ''; box.focus(); }
    }
  }).catch(function () {
    if (note) { note.textContent = 'Could not reach the PC.'; }
  });
}

function connectWS() {
  // READS: CFG
  // WRITES: ws, pingTimer
  var url = 'ws://' + CFG.SERVER_IP + ':' + CFG.WS_PORT;
  setBadge('CONNECTING…', '');

  try { ws = new WebSocket(url); } catch(e) { setBadge('ERROR', 'err'); return; }

  ws.onopen = function() {
    setBadge('LIVE', 'on');
    ws.send(JSON.stringify({ type: 'register', role: 'controller',
                             token: PAIR_TOKEN }));
    startPing();
    log('Connected to ' + url);
  };

  ws.onmessage = function(evt) {
    try {
      var msg = JSON.parse(evt.data);
      handleMessage(msg);
    } catch(e) { log('Parse error: ' + e); }
  };

  ws.onclose = function() {
    stopPing();
    if (unpaired) { return; }          // waiting on a PIN, not on the network
    setBadge('OFFLINE', 'err');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = function() { setBadge('ERROR', 'err'); };
}

function handleMessage(msg) {
  if (msg.type === 'unpaired') {
    // Retrying every three seconds with a secret the PC has refused is
    // just a slow brute force. Ask the person instead.
    unpaired = true;
    setBadge('NOT PAIRED', 'err');
    showPinScreen('This PC does not know that phone yet.');
    return;
  }
  if (msg.type === 'registered') { log('Registered as controller'); return; }
  if (msg.type === 'pong') {
    var lat = Date.now() - pingStart;
    document.getElementById('ping-disp').textContent = lat + ' ms';
    return;
  }
  if (msg.type === 'ack') {
    confirmPress(msg.id, msg.ok);
    return;
  }
  if (msg.type === 'timers') {
    timerData = msg.timers || {};
    paintTimers();
    return;
  }
  if (msg.type === 'state') {
    applyState(msg.state);
    return;
  }
  if (msg.type === 'layout') {
    layout = msg.layout;
    // Sent with every push and ignored until now.
    if (typeof msg.pages === 'number') { pageCount = Math.max(1, msg.pages); }
    if (typeof msg.page === 'number') { pageIndex = msg.page; }
    renderPages();
    renderKeys();
    paintTimers();
    scanStart();          // the surface changed; the sweep follows it
    log('Layout received' +
        (pageCount > 1 ? ' (page ' + (pageIndex + 1) + ' of ' + pageCount + ')' : ''));
    return;
  }
}

// ── Scanning, dwell and repeat guard ─────────────────────────────
// Touching the key you want assumes you can reliably touch the key you
// want. Scanning is how somebody with one reliable movement uses a surface
// of forty keys: the highlight travels, and a single press - anywhere on
// the glass, or on a switch that presents itself as a keyboard - takes
// whatever is lit.
//
// Everything here is on the phone rather than the PC, because the person
// who needs it is the person holding this, and making them walk to a
// computer to switch on the thing that lets them use the computer is the
// wrong way round.
var SCAN_KEY = 'remapwrap.access';
var access = {
  mode: 'off',          // off | auto | step   - what advances the sweep
  pattern: 'linear',    // linear | rowcol     - what the sweep travels over
  rate: 1200,           // ms on each stop when scanning on its own
  dwell: 600,           // ms to hold before a hold counts as a choice
  guard: 0              // ms during which a second press is ignored
};
var scanAt = -1;
var scanTimer = null;
var lastFire = 0;
var scanPhase = 'rows';   // rowcol only: which half of the sweep we are in
var scanRow = null;       // the row taken, while choosing inside it
var sweeps = 0;           // passes over the current group with nothing chosen

function loadAccess() {
  try {
    var raw = localStorage.getItem(SCAN_KEY);
    if (raw) { access = Object.assign(access, JSON.parse(raw)); }
  } catch (e) { /* private mode, or a settings string somebody edited */ }
}

function saveAccess() {
  try { localStorage.setItem(SCAN_KEY, JSON.stringify(access)); }
  catch (e) { /* nothing to do; it works for this session */ }
}

function scannable() {
  // Pages first, then keys, so somebody scanning can change page without
  // help. A surface they cannot leave is a surface they are stuck on.
  var out = [];
  var strip = document.getElementById('page-strip');
  if (strip && !strip.hidden) {
    strip.children && [].forEach.call(strip.children, function (t) { out.push(t); });
  }
  var grid = document.getElementById('key-grid');
  if (grid) { [].forEach.call(grid.children, function (k) { out.push(k); }); }
  return out;
}

// ── Rows ─────────────────────────────────────────────────────────
// Sweeping forty keys one at a time costs twenty presses on average.
// Sweeping five rows and then eight keys costs about six. For somebody
// whose every press is effortful that is not a refinement, it is the
// difference between using the surface and giving up on it.
//
// Rows come from where the keys actually are, not from the grid: a control
// belongs to the first row its vertical span overlaps, so a tall slider
// beside short keys joins the row it starts in rather than inventing one.
function scanRows() {
  var rows = [];
  var strip = document.getElementById('page-strip');
  if (strip && !strip.hidden && strip.children.length) {
    rows.push([].slice.call(strip.children));
  }

  var grid = document.getElementById('key-grid');
  if (!grid) { return rows; }

  // A layout can place its keys explicitly or let them flow across the
  // grid. Both have rows; only one says so. Reading y off a flowing layout
  // gave every key y=0, so twelve keys became one row of twelve and row
  // and column scanning was worse than useless - it added a press and
  // saved nothing. Where there are no coordinates the row is worked out
  // from the position in the list and the width of the board.
  var cols = Math.max(1, layout.cols || 1);
  var placed = [].slice.call(grid.children).map(function (el, i) {
    var key = (layout.keys || []).filter(function (k) {
      return k.id === el.dataset.id; })[0] || {};
    var flowing = typeof key.y !== 'number';
    return { el: el,
             y: flowing ? Math.floor(i / cols) : key.y,
             h: flowing ? 1 : (typeof key.h === 'number' ? key.h : 1),
             x: flowing ? (i % cols) : (typeof key.x === 'number' ? key.x : 0) };
  }).sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); });

  var current = null;
  placed.forEach(function (item) {
    if (!current || item.y >= current.bottom) {
      current = { bottom: item.y + item.h, items: [] };
      rows.push(current.items);
    } else {
      // A control reaching further down stretches the row it joined, so a
      // neighbour starting inside it lands here too rather than alone.
      current.bottom = Math.max(current.bottom, item.y + item.h);
    }
    current.items.push(item.el);
  });
  return rows;
}

// One stop on the sweep. Linear stops are single controls; row and column
// stops are a whole row, then the controls inside the row that was taken.
function scanGroups() {
  if (access.pattern !== 'rowcol') {
    return scannable().map(function (el) { return [el]; });
  }
  if (scanPhase === 'rows') { return scanRows(); }
  return (scanRow || []).map(function (el) { return [el]; });
}

function announce(text) {
  var el = document.getElementById('scan-say');
  if (el) { el.textContent = text; }
}

function paintScan() {
  var groups = scanGroups();
  var lit = groups[scanAt] || [];
  scannable().forEach(function (el) { el.classList.remove('scanning'); });
  lit.forEach(function (el) { el.classList.add('scanning'); });

  if (!lit.length) { return; }
  if (access.pattern === 'rowcol' && scanPhase === 'rows') {
    // A row is announced by how many things are in it and what the first
    // one is, which is enough to recognise it without reading all of them.
    announce('Row ' + (scanAt + 1) + ' of ' + groups.length + ', ' +
             lit.length + ' key' + (lit.length === 1 ? '' : 's') +
             ', starting ' + (lit[0].getAttribute('aria-label') || ''));
  } else {
    announce((lit[0].getAttribute('aria-label') || lit[0].textContent || 'key') +
             ', ' + (scanAt + 1) + ' of ' + groups.length);
  }
}

function scanStep() {
  var groups = scanGroups();
  if (!groups.length) { return; }
  scanAt = scanAt + 1;

  if (scanAt >= groups.length) {
    scanAt = 0;
    sweeps += 1;
    // Entering a row you did not want must not trap you in it. After two
    // passes with nothing chosen, the sweep backs out to the rows again.
    if (access.pattern === 'rowcol' && scanPhase === 'keys' && sweeps >= 2) {
      leaveRow();
      return;
    }
  }
  paintScan();
}

function leaveRow() {
  scanPhase = 'rows';
  scanRow = null;
  scanAt = -1;
  sweeps = 0;
  announce('Back to the rows.');
  scanStep();
}

function scanStop() {
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  scanAt = -1;
  scanPhase = 'rows';
  scanRow = null;
  sweeps = 0;
  scannable().forEach(function (el) { el.classList.remove('scanning'); });
}

function scanStart() {
  scanStop();
  if (access.mode === 'off') { return; }
  scanAt = -1;
  scanStep();
  if (access.mode === 'auto') {
    scanTimer = setInterval(scanStep, access.rate);
  }
}

function scanChoose() {
  var groups = scanGroups();
  var lit = groups[scanAt];
  if (!lit || !lit.length) { return; }

  // Tremor produces two presses where one was meant. The guard is off by
  // default because it costs speed, and available because for some people
  // it is the difference between usable and not.
  var now = Date.now();
  if (access.guard && (now - lastFire) < access.guard) { return; }
  lastFire = now;

  if (access.pattern === 'rowcol' && scanPhase === 'rows') {
    if (lit.length === 1) {
      // A row of one has nothing to choose between. Taking it directly
      // saves a press that would only ever have one answer.
      chooseElement(lit[0]);
      return;
    }
    scanPhase = 'keys';
    scanRow = lit.slice();
    scanAt = -1;
    sweeps = 0;
    announce('Row taken, ' + scanRow.length + ' keys.');
    scanStep();
    return;
  }

  chooseElement(lit[0]);
}

function chooseElement(el) {
  if (!el) { return; }
  if (el.classList.contains('page-tab')) {
    goToPage(parseInt(el.getAttribute('data-page'), 10));
    scanStart();          // the strip is rebuilt; start the sweep again
    return;
  }
  activateElement(el);
  if (access.pattern === 'rowcol') { leaveRow(); }
}

// One place that "press this" goes through, whatever asked for it: a
// finger, a switch, the scanner, or a keyboard.
function activateElement(el) {
  if (!el) { return; }
  var type = el.dataset.type;
  if (type === 'dial' || type === 'slider') {
    // A value control has no single action to fire. Scanning selects it and
    // the arrow keys move it, which is how switch users expect a continuous
    // control to behave.
    el.focus && el.focus();
    announce('selected, use up and down to change it');
    return;
  }
  pressKey(el);
  releaseKey(el, true);
}

// ── the switch itself ────────────────────────────────────────────
// A switch on a phone is one of two things: a tap anywhere on the glass,
// or a Bluetooth switch that presents as a keyboard and sends space or
// enter. Both are handled the same way.
var holdStart = 0;
var holdTimer = null;

function switchDown() {
  if (access.mode === 'off') { return; }
  holdStart = Date.now();
  if (access.mode === 'step' && access.dwell > 0) {
    holdTimer = setTimeout(function () {
      holdTimer = null;
      scanChoose();                 // held long enough: that is a choice
    }, access.dwell);
  }
}

function switchUp() {
  if (access.mode === 'off') { return; }
  var held = Date.now() - holdStart;
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }

  if (access.mode === 'auto') {
    scanChoose();
    return;
  }
  // step: a short press moves on, a long one already chose on the timer
  if (access.dwell === 0 || held < access.dwell) { scanStep(); }
}

document.addEventListener('keydown', function (e) {
  if (access.mode === 'off') { return; }
  if (e.repeat) { return; }
  if (e.key !== ' ' && e.key !== 'Enter') { return; }
  if (document.getElementById('settings-sheet') &&
      !document.getElementById('settings-sheet').hidden) { return; }
  e.preventDefault();
  switchDown();
});
document.addEventListener('keyup', function (e) {
  if (access.mode === 'off') { return; }
  if (e.key !== ' ' && e.key !== 'Enter') { return; }
  e.preventDefault();
  switchUp();
});

// ── settings ─────────────────────────────────────────────────────
function openSettings() {
  var sheet = document.getElementById('settings-sheet');
  if (sheet) { sheet.hidden = false; }
  scanStop();                        // do not scan the settings away
}

function closeSettings() {
  var sheet = document.getElementById('settings-sheet');
  if (sheet) { sheet.hidden = true; }
  saveAccess();
  scanStart();
}

function describeMode() {
  return {
    off: 'Keys work the way they look: touch the one you want.',
    auto: 'The highlight moves on its own. Press anywhere, or a switch, ' +
          'to choose what is lit.',
    step: 'Press to move the highlight along. Hold to choose what is lit.'
  }[access.mode] || '';
}

function describePattern() {
  if (access.pattern !== 'rowcol') {
    return 'Simple, and slow on a big board: it stops at every key.';
  }
  // The number is worth showing rather than describing, because it is the
  // whole argument for the setting.
  var rows = scanRows();
  var keys = scannable().length;
  if (!rows.length || !keys) { return 'A row at a time, then the keys in it.'; }
  var widest = Math.max.apply(null, rows.map(function (r) { return r.length; }));
  return 'About ' + Math.ceil(rows.length / 2 + widest / 2) +
         ' presses to reach a key instead of about ' + Math.ceil(keys / 2) + '.';
}

function syncSettings() {
  var mode = document.getElementById('scan-mode');
  var pattern = document.getElementById('scan-pattern');
  var rate = document.getElementById('scan-rate');
  var dwell = document.getElementById('dwell-ms');
  var guard = document.getElementById('repeat-guard');
  if (!mode) { return; }
  mode.value = access.mode;
  if (pattern) {
    pattern.value = access.pattern;
    document.getElementById('scan-pattern-note').textContent = describePattern();
    document.getElementById('scan-pattern-field').hidden = access.mode === 'off';
  }
  rate.value = access.rate;
  dwell.value = access.dwell;
  guard.value = access.guard;
  document.getElementById('scan-mode-note').textContent = describeMode();
  document.getElementById('scan-rate-note').textContent =
    (access.rate / 1000).toFixed(1) + ' seconds';
  document.getElementById('dwell-note').textContent =
    access.dwell === 0 ? 'off' : (access.dwell / 1000).toFixed(1) + ' seconds';
  document.getElementById('repeat-note').textContent =
    access.guard === 0 ? 'off' : (access.guard / 1000).toFixed(2) + ' seconds';
  document.getElementById('scan-rate-field').hidden = access.mode !== 'auto';
}

function wireSettings() {
  var open = document.getElementById('settings-open');
  var done = document.getElementById('settings-close');
  var mode = document.getElementById('scan-mode');
  var rate = document.getElementById('scan-rate');
  var dwell = document.getElementById('dwell-ms');
  var guard = document.getElementById('repeat-guard');
  if (!open || !mode) { return; }

  open.addEventListener('click', function () { syncSettings(); openSettings(); });
  done.addEventListener('click', closeSettings);
  mode.addEventListener('change', function () {
    access.mode = mode.value; saveAccess(); syncSettings(); scanStart(); });
  var pattern = document.getElementById('scan-pattern');
  if (pattern) {
    pattern.addEventListener('change', function () {
      access.pattern = pattern.value; saveAccess(); syncSettings(); scanStart(); });
  }
  rate.addEventListener('input', function () {
    access.rate = parseInt(rate.value, 10); syncSettings(); scanStart(); });
  dwell.addEventListener('input', function () {
    access.dwell = parseInt(dwell.value, 10); syncSettings(); });
  guard.addEventListener('input', function () {
    access.guard = parseInt(guard.value, 10); syncSettings(); });
  syncSettings();
}

// ── Pages ────────────────────────────────────────────────────────
// The server has always sent the page number and the count with every
// layout, and this file ignored both, so a profile with four pages showed
// its first one and nothing else. A page is a whole surface: the keys
// change, the board size can change, and muscle memory belongs to the page
// rather than the profile.
var pageIndex = 0;
var pageCount = 1;

function renderPages() {
  var strip = document.getElementById('page-strip');
  if (!strip) { return; }

  if (pageCount < 2) {
    strip.hidden = true;
    strip.innerHTML = '';
    return;
  }
  strip.hidden = false;
  strip.innerHTML = '';

  for (var i = 0; i < pageCount; i++) {
    var tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'page-tab';
    tab.textContent = String(i + 1);
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', i === pageIndex ? 'true' : 'false');
    tab.setAttribute('aria-label', 'Page ' + (i + 1) + ' of ' + pageCount);
    // The index rides on the element rather than a closure, so the strip
    // can be rebuilt without leaving handlers behind pointing at old ones.
    tab.setAttribute('data-page', String(i));
    strip.appendChild(tab);
  }
}

function goToPage(index) {
  if (index < 0 || index >= pageCount || index === pageIndex) { return; }
  send({ type: 'page', index: index });
  // The tab responds now rather than when the PC replies. A control that
  // waits for a round trip before acknowledging feels broken on a slow
  // network even when it is working.
  pageIndex = index;
  renderPages();
}

document.addEventListener('click', function (e) {
  var tab = e.target && e.target.closest ? e.target.closest('.page-tab') : null;
  if (!tab) { return; }
  goToPage(parseInt(tab.getAttribute('data-page'), 10));
});

// Arrow keys along the strip, which is what a tablist is expected to do
// and what anybody using a keyboard or a switch will try.
document.addEventListener('keydown', function (e) {
  var tab = e.target && e.target.closest ? e.target.closest('.page-tab') : null;
  if (!tab) { return; }
  var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!step) { return; }
  e.preventDefault();
  var next = pageIndex + step;
  if (next < 0 || next >= pageCount) { return; }
  goToPage(next);
  var el = document.querySelector('.page-tab[data-page="' + next + '"]');
  if (el) { el.focus(); }
});

// ── Ping ───────────────────────────────────────────────────────
function startPing() {
  stopPing();
  pingTimer = setInterval(function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      pingStart = Date.now();
      ws.send(JSON.stringify({ type: 'ping' }));
    }
  }, CFG.PING_INTERVAL);
}
function stopPing() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }

// ── Render keys ────────────────────────────────────────────────
/*
  A key can be any colour the person building the layout picks, so the
  label works out its own ink rather than trusting a theme. Black on a
  dark key measured 1.2:1 - invisible - because the palette changed under
  colours chosen for the old one. This cannot happen again whatever
  colour anybody chooses.
*/
function inkFor(background) {
  var m = String(background || '').match(/[0-9a-f]{2}/gi);
  if (!m || m.length < 3) { return 'var(--text)'; }
  var lum = ['0.2126', '0.7152', '0.0722'].map(Number).reduce(function(a, w, i) {
    var c = parseInt(m[i], 16) / 255;
    return a + w * (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  }, 0);
  // 0.179 is where white and black swap places against a surface.
  return lum > 0.179 ? '#000000' : '#ffffff';
}

function renderKeys() {
  // READS: layout
  // WRITES: #key-grid DOM
  //
  // A control is drawn as the thing it is. Every type used to arrive here
  // as a button, so a dial was a button labelled MASTER that fired once
  // and a slider was the same button again. A dial you cannot turn is not
  // a dial.
  var grid = document.getElementById('key-grid');
  var cols = layout.cols || 24;
  var rows = layout.rows || 14;
  grid.style.setProperty('--cols', cols);
  grid.style.setProperty('--rows', rows);
  grid.innerHTML = '';

  (layout.keys || []).forEach(function(key) {
    var type = key.type || 'key';
    var el = (type === 'dial' || type === 'slider')
      ? buildValueControl(key, type)
      : (type === 'timer' ? buildTimer(key)
      : (type === 'input' ? buildComposeKey(key)
      : buildButton(key, type)));
    el.dataset.id = key.id;
    el.dataset.type = type;

    // The phone honours where the control was put. A layout that arrives
    // as a flat list in a different order is a different instrument, and
    // muscle memory is most of the point of a control surface.
    if (typeof key.x === 'number') {
      el.style.position = 'absolute';
      el.style.left   = (key.x / cols * 100) + '%';
      el.style.top    = (key.y / rows * 100) + '%';
      el.style.width  = (key.w / cols * 100) + '%';
      el.style.height = (key.h / rows * 100) + '%';
      if (key.shape === 'circle')      { el.style.borderRadius = '50%'; }
      else if (key.shape === 'pill')   { el.style.borderRadius = '999px'; }
      else if (key.shape === 'rect')   { el.style.borderRadius = '0'; }
      else                             { el.style.borderRadius = '10px'; }
    }
    grid.appendChild(el);
  });
}

// ── The two faces of a key ───────────────────────────────────────
// A toggle that reads MUTE MIC whether or not the microphone is muted is
// telling you what the key does rather than what is true. whenOn lets a
// layout say both:
//
//   { "label": "MIC LIVE", "color": "#12211a",
//     "whenOn": { "label": "MUTED", "color": "#2a1216" } }
//
// Everything in whenOn is optional; anything left out keeps the ordinary
// face, so a layout can change only the colour, or only the words.
// Update what a key says without rebuilding it, so a state arriving from
// the PC changes the words and the colour in place.
function repaintFace(el, key) {
  var face = faceFor(key);
  var label = el.querySelector('.key-label');
  if (label) { label.textContent = face.label; }
  var sub = el.querySelector('.key-sub');
  if (sub) { sub.textContent = face.sub; }
  if (face.color) {
    el.style.background = face.color;
    el.style.color = inkFor(face.color);
  }
  el.setAttribute('aria-label', face.label + (face.sub ? ', ' + face.sub : ''));
}

function faceFor(key) {
  var on = key.state === true;
  var alt = (on && key.whenOn) ? key.whenOn : null;
  return {
    label: (alt && alt.label !== undefined) ? alt.label : (key.label || ''),
    sub:   (alt && alt.sub !== undefined) ? alt.sub : (key.sub || ''),
    color: (alt && alt.color) ? alt.color : (key.color || '')
  };
}

function buildButton(key, type) {
  var btn = document.createElement('div');
  btn.className = 'key-btn type-' + type + (key.state ? ' on' : '');

  // A div that acts like a button has to say so, be reachable by keyboard,
  // and carry its name - the label inside is styled text, not an accessible
  // name, and a toggle has to announce whether it is on.
  btn.setAttribute('role', type === 'toggle' ? 'switch' : 'button');
  btn.setAttribute('tabindex', '0');
  btn.setAttribute('aria-label', key.label + (key.sub ? ', ' + key.sub : ''));
  if (type === 'toggle') {
    btn.setAttribute('aria-checked', key.state ? 'true' : 'false');
  }

  btn.dataset.label = key.label;
  btn.dataset.command = key.command || key.action || '';
  btn.dataset.behaviour = key.behaviour || 'press';
  if (key.color) {
    btn.style.background = key.color;
    btn.style.color = inkFor(key.color);
  }

  // A key can carry a second face for when it is on. A mute button that
  // still says MUTE MIC while the microphone is already muted is a button
  // that has to be read twice, and on a surface somebody is using without
  // looking directly at it, twice is too many.
  var face = faceFor(key);
  if (face.color) {
    btn.style.background = face.color;
    btn.style.color = inkFor(face.color);
  }
  btn.setAttribute('aria-label', face.label + (face.sub ? ', ' + face.sub : ''));

  btn.innerHTML =
    (key.lit ? '<span class="lamp"></span>' : '') +
    '<span class="key-label">' + escHtml(face.label) + '</span>' +
    (face.sub ? '<span class="key-sub">' + escHtml(face.sub) + '</span>' : '');

  // A pad fires the moment it is struck. Waiting for release is right for
  // a key and wrong for a soundboard, where the delay is audible.
  var fireOnDown = (type === 'pad');

  btn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    pressKey(btn);
    if (fireOnDown) { fireControl(key, btn); }
  }, { passive: false });

  btn.addEventListener('touchend', function(e) {
    e.preventDefault();
    btn.classList.remove('pressed');
    if (!fireOnDown) { fireControl(key, btn); }
  }, { passive: false });

  btn.addEventListener('touchcancel', function() {
    btn.classList.remove('pressed');
  });

  btn.addEventListener('mousedown', function() {
    pressKey(btn);
    if (fireOnDown) { fireControl(key, btn); }
  });
  btn.addEventListener('mouseup', function() {
    btn.classList.remove('pressed');
    if (!fireOnDown) { fireControl(key, btn); }
  });

  return btn;
}

function fireControl(key, el) {
  // A toggle carries its own state, so the phone reports what the state
  // became rather than that something was pressed. Nothing downstream has
  // to remember which way it was.
  if ((key.type || 'key') === 'toggle') {
    key.state = !key.state;
    el.classList.toggle('on', !!key.state);
    triggerHaptic(key.state ? 30 : CFG.HAPTIC_MS);
    send({ type: 'toggle', id: key.id, label: key.label,
           command: key.command, state: !!key.state });
    return;
  }
  send({ type: 'keypress', id: key.id, label: key.label,
         // A keystroke key carries its combination in arg - that is what
         // the layout format calls it and what the generators write.
         // Falling back to key.command sent the literal string
         // "win.keystroke" to the key resolver, so every generated
         // shortcut resolved to nothing and did nothing.
         command: key.command,
         action: key.action || key.arg || key.command,
         behaviour: key.behaviour || 'press' });
}

// ── dials and sliders ────────────────────────────────────────────

// ── Compose ──────────────────────────────────────────────────────
// The phone already has a keyboard this person can use - theirs, with
// their prediction, their dictation, their language - and the PC has none
// of that for them. This is the shortest route between somebody and a text
// box on a computer they cannot easily type into.
//
// SAY IT OUT LOUD is the same text through the PC's voice, which is what
// turns this from a keyboard into a way of speaking.
var composeKey = null;

function openCompose(key) {
  composeKey = key || null;
  var sheet = document.getElementById('compose-sheet');
  var box = document.getElementById('compose-text');
  var title = document.getElementById('compose-title');
  if (!sheet) { return; }
  if (title) { title.textContent = (key && key.label) ? key.label.toUpperCase()
                                                      : 'TYPE SOMETHING'; }
  if (box) { box.value = (key && key.arg) ? key.arg : ''; }
  sheet.hidden = false;
  scanStop();                       // do not sweep the keyboard away
  if (box) { box.focus(); }
}

function closeCompose() {
  var sheet = document.getElementById('compose-sheet');
  if (sheet) { sheet.hidden = true; }
  composeKey = null;
  scanStart();
}

function sendCompose(mode) {
  var box = document.getElementById('compose-text');
  var note = document.getElementById('compose-note');
  var text = box ? box.value : '';
  if (!text) { if (box) { box.focus(); } return; }
  send({ type: 'compose', mode: mode, text: text });
  if (note) {
    note.textContent = mode === 'say' ? 'Said.' : 'Sent to the PC.';
  }
  triggerHaptic(CFG.HAPTIC_MS);
  // The sheet stays open on purpose: somebody saying several things in a
  // row should not have to reopen it between sentences.
  if (mode !== 'say' && box) { box.select && box.select(); }
}

function buildComposeKey(key) {
  var el = document.createElement('div');
  el.className = 'key-btn type-input';
  if (key.color) {
    el.style.background = key.color;
    el.style.color = inkFor(key.color);
  }
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', (key.label || 'Type something') +
                  (key.sub ? ', ' + key.sub : ''));
  el.innerHTML =
    '<span class="key-label">' + escHtml(key.label || 'TYPE') + '</span>' +
    (key.sub ? '<span class="key-sub">' + escHtml(key.sub) + '</span>' : '');
  var open = function (e) { if (e) { e.preventDefault(); } openCompose(key); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { open(e); }
  });
  return el;
}

function wireCompose() {
  var send_ = document.getElementById('compose-send');
  var say = document.getElementById('compose-say');
  var close = document.getElementById('compose-close');
  if (send_) { send_.addEventListener('click', function () { sendCompose('type'); }); }
  if (say) { say.addEventListener('click', function () { sendCompose('say'); }); }
  if (close) { close.addEventListener('click', closeCompose); }
}

// ── Timers ───────────────────────────────────────────────────────
// The PC owns the count and only tells us when something changed. What is
// on the face is worked out here from the local clock, so a running timer
// costs nothing on the network and keeps ticking if the connection drops.
var timerData = {};
var timerPaint = null;

function timerText(t) {
  if (!t) { return '--:--'; }
  var ms = t.accumulated + (t.running ? (Date.now() - t.startedAt) : 0);
  if (t.duration) { ms = Math.max(0, t.duration * 1000 - ms); }
  var total = Math.floor(ms / 1000);
  var mm = Math.floor(total / 60);
  var ss = total % 60;
  // Past an hour, minutes stop being readable at a glance.
  if (mm >= 60) {
    return Math.floor(mm / 60) + ':' + String(mm % 60).padStart(2, '0') +
           ':' + String(ss).padStart(2, '0');
  }
  return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}

function paintTimers() {
  var any = false;
  (layout.keys || []).forEach(function (key) {
    if (key.type !== 'timer') { return; }
    var el = document.querySelector('[data-id="' + key.id + '"]');
    if (!el) { return; }
    var t = timerData[key.id];
    var face = el.querySelector('.timer-face');
    if (face) { face.textContent = timerText(t); }
    el.classList.toggle('timer-running', !!(t && t.running));
    el.classList.toggle('timer-done', !!(t && t.done));
    // What a screen reader hears has to be the same fact as the face.
    el.setAttribute('aria-label',
      (key.label || 'Timer') + ', ' + timerText(t) +
      (t && t.done ? ', finished' : t && t.running ? ', running' : ', stopped'));
    if (t && t.running) { any = true; }
  });
  // Only run a repaint while something is actually counting.
  if (any && !timerPaint) { timerPaint = setInterval(paintTimers, 250); }
  if (!any && timerPaint) { clearInterval(timerPaint); timerPaint = null; }
}

function buildTimer(key) {
  var el = document.createElement('div');
  el.className = 'key-btn type-timer';
  if (key.color) {
    el.style.background = key.color;
    el.style.color = inkFor(key.color);
  }
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', (key.label || 'Timer') + ', stopped');
  el.innerHTML =
    '<span class="timer-face" aria-hidden="true">--:--</span>' +
    '<span class="key-label">' + escHtml(key.label || 'TIMER') + '</span>';

  var fire = function (action) {
    send({ type: 'timer', id: key.id, action: action,
           duration: parseInt(key.arg, 10) || 0, label: key.label || '' });
  };
  // Press to start or pause, hold to put it back to the beginning. One key
  // doing both is one key rather than three on a surface where every key
  // costs presses to reach.
  var held = null;
  var down = function () { held = setTimeout(function () {
    held = null; fire('reset'); triggerHaptic(CFG.HAPTIC_MS); }, 700); };
  var up = function () {
    if (held) { clearTimeout(held); held = null; fire('toggle'); } };
  el.addEventListener('touchstart', down, { passive: true });
  el.addEventListener('touchend', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fire('toggle'); }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); fire('reset'); }
  });
  return el;
}

function buildValueControl(key, type) {
  var wrap = document.createElement('div');
  wrap.className = 'key-btn value-ctl type-' + type;
  if (key.color) {
    wrap.style.background = key.color;
    wrap.style.color = inkFor(key.color);
  }
  if (typeof key.value !== 'number') { key.value = 50; }

  // A screen reader met a bare div here and had nothing to say about it.
  // A dial and a slider are both the same thing to assistive technology -
  // a value inside a range - so both get the slider role, a name, and a
  // reading that stays in step with the face.
  wrap.setAttribute('role', 'slider');
  wrap.setAttribute('tabindex', '0');
  wrap.setAttribute('aria-label', key.label + (key.sub ? ', ' + key.sub : ''));
  wrap.setAttribute('aria-valuemin', '0');
  wrap.setAttribute('aria-valuemax', '100');
  wrap.setAttribute('aria-valuenow', String(Math.round(key.value)));
  wrap.setAttribute('aria-orientation', type === 'slider' ? 'vertical' : 'horizontal');

  wrap.innerHTML =
    '<div aria-hidden="true" class="' +
      (type === 'dial' ? 'dial-face' : 'slider-face') + '">' +
      (type === 'dial'
        ? '<div class="dial-arc"></div><div class="dial-pointer"></div>'
        : '<div class="slider-fill"></div>') +
      '<span class="value-read">' + Math.round(key.value) + '</span>' +
    '</div>' +
    '<span class="key-label">' + escHtml(key.label) + '</span>' +
    (key.sub ? '<span class="key-sub">' + escHtml(key.sub) + '</span>' : '');

  paintValue(wrap, key);
  attachValueDrag(wrap, key, type);
  attachValueKeys(wrap, key, type);
  return wrap;
}

// A dial that can only be turned by dragging cannot be used by anybody
// working with a keyboard, a switch, or a screen reader. Arrow keys move
// it by one, page keys by ten, home and end to the ends - the behaviour
// every native range control already has and that people expect.
function attachValueKeys(wrap, key, type) {
  wrap.addEventListener('keydown', function (e) {
    var step = 0;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { step = 1; }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { step = -1; }
    else if (e.key === 'PageUp') { step = 10; }
    else if (e.key === 'PageDown') { step = -10; }
    else if (e.key === 'Home') { step = -101; }
    else if (e.key === 'End') { step = 101; }
    else { return; }

    e.preventDefault();
    var next = Math.max(0, Math.min(100, Math.round(key.value) + step));
    key.value = next;
    paintValue(wrap, key);
    sendValue(key);
  });
}

// The PC heard it. A press used to rely on navigator.vibrate, which iOS
// does not implement, so on an iPhone nothing happened at all until the
// thing being controlled changed - and for a keystroke sent to another
// window, that is invisible. The key now confirms on its own face.
function confirmPress(id, ok) {
  var el = document.querySelector('[data-id="' + id + '"]');
  if (!el) { return; }
  var cls = ok ? 'confirmed' : 'unwired';
  el.classList.remove('confirmed', 'unwired');
  // Reading offsetWidth restarts the animation when the same key is
  // pressed twice quickly; without it the second press shows nothing.
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function () { el.classList.remove(cls); }, ok ? 320 : 900);
  if (ok) { triggerHaptic(CFG.HAPTIC_MS); }
}

// ── What the machine says is true ────────────────────────────────
// Until now a dial only remembered where it was last dragged, so touching
// the volume keys on the keyboard made every reading on the phone a lie.
// The PC reports the real figures twice a second; a control that is being
// turned right now is left alone, because arguing with a thumb mid-turn
// is worse than being briefly out of date.
function applyState(state) {
  if (!state) { return; }
  (layout.keys || []).forEach(function (key) {
    var incoming = state[key.command];
    if (incoming === null || incoming === undefined) { return; }

    var el = document.querySelector('[data-id="' + key.id + '"]');
    if (!el || el.dataset.holding === '1') { return; }

    if (typeof incoming === 'boolean') {
      key.state = incoming;
      el.classList.toggle('on', incoming);
      // The second face has to change here too. Toggling the lamp and
      // leaving the words alone is the exact failure whenOn exists to
      // prevent: a key that lights up while still reading MIC LIVE.
      repaintFace(el, key);
      return;
    }

    key.value = incoming;
    if (el.dataset.type === 'dial' || el.dataset.type === 'slider') {
      paintValue(el, key);
    }
  });
}

function paintValue(wrap, key) {
  var v = Math.max(0, Math.min(100, key.value));
  var read = wrap.querySelector('.value-read');
  if (read) { read.textContent = Math.round(v); }

  // The reading a screen reader announces has to be the reading on the
  // face. Setting one and not the other is worse than setting neither.
  if (wrap.getAttribute('role') === 'slider') {
    wrap.setAttribute('aria-valuenow', String(Math.round(v)));
    wrap.setAttribute('aria-valuetext', Math.round(v) + ' percent');
  }

  var arc = wrap.querySelector('.dial-arc');
  if (arc) {
    // 270 degrees of travel, the way a real pot is cut, starting at the
    // seven o'clock position rather than straight up.
    var deg = 135 + (v / 100) * 270;
    arc.style.background =
      'conic-gradient(from 135deg, var(--accent) 0deg, var(--accent) ' +
      ((v / 100) * 270) + 'deg, transparent ' + ((v / 100) * 270) + 'deg)';
    var pointer = wrap.querySelector('.dial-pointer');
    if (pointer) { pointer.style.transform = 'rotate(' + deg + 'deg)'; }
  }

  var fill = wrap.querySelector('.slider-fill');
  if (fill) { fill.style.height = v + '%'; }
}

function attachValueDrag(wrap, key, type) {
  var dragging = false;
  var lastAngle = null;
  var lastSent = 0;
  var detent = (key.behaviour === 'detent');

  function pointOf(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: t.clientX, y: t.clientY };
  }

  function angleAt(p, rect) {
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    return Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
  }

  function begin(e) {
    dragging = true;
    // While a thumb is on this control the PC's reading is stale by
    // definition. Marking it held stops applyState fighting the drag.
    wrap.dataset.holding = '1';
    wrap.classList.add('active');
    lastAngle = null;
    if (e.cancelable) { e.preventDefault(); }
  }

  function move(e) {
    if (!dragging) { return; }
    if (e.cancelable) { e.preventDefault(); }
    var p = pointOf(e);
    var rect = wrap.getBoundingClientRect();
    var before = key.value;

    if (type === 'dial') {
      var a = angleAt(p, rect);
      if (lastAngle !== null) {
        var d = a - lastAngle;
        // Crossing the join reads as a 350 degree jump; it is 10 the
        // other way, and without this the value snaps end to end.
        if (d > 180) { d -= 360; }
        if (d < -180) { d += 360; }
        key.value = Math.max(0, Math.min(100, key.value + (d / 270) * 100));
      }
      lastAngle = a;
    } else {
      // A slider follows the finger rather than accumulating: where you
      // put it is where it is.
      var pct = 100 - ((p.y - rect.top) / rect.height) * 100;
      key.value = Math.max(0, Math.min(100, pct));
    }

    if (detent) { key.value = Math.round(key.value / 10) * 10; }
    if (Math.round(key.value) !== Math.round(before)) {
      paintValue(wrap, key);
      // A drag is hundreds of events and the network does not need all of
      // them; the value is sent at most every 40ms and always on release.
      var now = Date.now();
      if (now - lastSent > 40) {
        lastSent = now;
        sendValue(key);
      }
      if (detent) { triggerHaptic(8); }
    }
  }

  function end(e) {
    if (!dragging) { return; }
    dragging = false;
    wrap.dataset.holding = '0';
    wrap.classList.remove('active');
    lastAngle = null;
    if (e && e.cancelable) { e.preventDefault(); }
    sendValue(key);
    triggerHaptic(CFG.HAPTIC_MS);
  }

  wrap.addEventListener('touchstart', begin, { passive: false });
  wrap.addEventListener('touchmove',  move,  { passive: false });
  wrap.addEventListener('touchend',   end,   { passive: false });
  wrap.addEventListener('touchcancel', end,  { passive: false });

  wrap.addEventListener('mousedown', function(e) {
    begin(e);
    function mm(ev) { move(ev); }
    function mu(ev) {
      end(ev);
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
    }
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  });
}

function sendValue(key) {
  send({ type: 'value', id: key.id, label: key.label,
         command: key.command, behaviour: key.behaviour,
         value: Math.round(key.value) });
}

function pressKey(btn) {
  // READS: btn dataset
  // WRITES: DOM class, pressTimers
  btn.classList.add('pressed');
  triggerHaptic(CFG.HAPTIC_MS);
}

function releaseKey(btn, fire) {
  // READS: btn dataset
  // WRITES: DOM class, WebSocket
  btn.classList.remove('pressed');
  if (fire) sendKeypress(btn.dataset.id, btn.dataset.label, btn.dataset.action);
}

// ── Send keypress to server ────────────────────────────────────
/*
  One way out to the server, so a dial, a toggle and a key are the same
  code path with a different type on the message. sendKeypress is kept
  because the pairing handshake and the older callers still use it.
*/
function send(msg) {
  // READS: ws
  // WRITES: WebSocket send
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('Not connected'); return; }
  msg.ts = Date.now();
  ws.send(JSON.stringify(msg));
  log('SEND: ' + (msg.label || msg.id) + ' -> ' +
      (msg.type === 'value' ? msg.value
        : msg.type === 'toggle' ? (msg.state ? 'on' : 'off')
        : (msg.command || msg.action || '')));
}

function sendKeypress(id, label, action) {
  // READS: ws
  // WRITES: WebSocket send
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('Not connected'); return; }
  ws.send(JSON.stringify({
    type:   'keypress',
    id:     id,
    label:  label,
    action: action,
    ts:     Date.now()
  }));
  log('SEND: ' + label + ' → ' + action);
}

// ── Haptic feedback ────────────────────────────────────────────
function triggerHaptic(ms) {
  // READS: navigator.vibrate
  if (navigator.vibrate) navigator.vibrate(ms);
}

// ── UI helpers ─────────────────────────────────────────────────
function setBadge(text, cls) {
  var b = document.getElementById('conn-badge');
  b.textContent = text;
  b.className = 'conn-badge' + (cls ? ' ' + cls : '');
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function log(msg) {
  if (CFG.DEV_MODE) console.log('[FKEYS-CTRL] ' + msg);
}
